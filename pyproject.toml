[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-swarm"
version = "0.1.0"
description = "A local, policy-governed autonomous agent swarm platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.8",
  "httpx>=0.27",
  "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]
browser = ["playwright>=1.40"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
# Fail closed on syntax errors and undefined names. Broader style (E501, I, F401,
# UP) would require a repo-wide reformat of current main — deferred.
select = ["E9", "F63", "F7", "F82"]
