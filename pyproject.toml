[project]
name = "agent-swarm"
version = "0.1.0"
description = "A local, policy-governed autonomous agent swarm platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.8",
  "httpx>=0.27",
  "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
browser = ["playwright>=1.40"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
